[package]
name = "pdf-scan-core"
description = "Heuristic scanner of PDF files for potentially malicious content"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
aes = { version = "0.9", default-features = false }
md-5 = { version = "0.11", default-features = false }
memchr = "2"
miniz_oxide = "0.8"
sha2 = { version = "0.11", default-features = false }
